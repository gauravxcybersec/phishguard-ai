<!DOCTYPE html>
<html>
<head>
    <title>PhishGuard AI</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a, #020617);
            color: white;
            text-align: center;
        }

        .container {
            margin-top: 100px;
        }

        h1 {
            font-size: 40px;
            color: #38bdf8;
        }

        p {
            color: #94a3b8;
        }

        input {
            width: 350px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #22c55e;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #16a34a;
        }

        .result {
            margin-top: 30px;
            font-size: 22px;
        }

        .safe {
            color: #22c55e;
        }

        .phishing {
            color: #ef4444;
        }

        .box {
            margin: auto;
            margin-top: 40px;
            padding: 30px;
            width: 450px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .footer {
            margin-top: 80px;
            font-size: 14px;
            color: #64748b;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🛡️ PhishGuard AI</h1>
    <p>AI-powered phishing detection using Machine Learning + Security Rules</p>

    <div class="box">
        <form method="post">
            <input type="text" name="url" placeholder="Enter URL (https://example.com)" required>
            <br>
            <button type="submit">Scan URL</button>
        </form>

        {% if result %}
            <div class="result">
                {% if "Safe" in result %}
                    <p class="safe">{{ result }}</p>
                {% else %}
                    <p class="phishing">{{ result }}</p>
                {% endif %}
                <p>{{ confidence }}</p>
            </div>
        {% endif %}
    </div>

    <div class="footer">
        Built by Gaurav 🚀
    </div>

</div>

</body>
</html>
